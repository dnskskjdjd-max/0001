name: Tracker

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (el minimo de GitHub); con carga alta GitHub puede atrasarlo o saltar ejecuciones
  workflow_dispatch:       # boton "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar tracker
        shell: powershell
        run: .\tracker.ps1

      - name: Ejecutar copiador NFL
        if: always()
        shell: powershell
        run: .\copier.ps1

      - name: Guardar datos en el repositorio
        if: always()
        shell: bash
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
