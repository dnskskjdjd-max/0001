name: Tracker

# El tracker corre en la PC cada 5 minutos (run-local.ps1). Este workflow queda solo como respaldo manual:
# no lo ejecutes mientras la PC este encendida, para no tener dos tracker escribiendo los mismos datos.
on:
  workflow_dispatch:       # boton "Run workflow" para ejecutarlo a mano

permissions:
  contents: write
  issues: write   # para enviar las alertas de venta como issues (llegan por correo)

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar tracker
        shell: powershell
        run: .\tracker.ps1

      # Sin "if: always()": si el tracker fallo, no se reenvian alertas viejas
      - name: Enviar alertas de venta
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path data\alerts-new.json) {
            $alerts = (Get-Content data\alerts-new.json -Raw -Encoding UTF8 | ConvertFrom-Json) | ForEach-Object { $_ }
            foreach ($a in $alerts) {
              $f = New-TemporaryFile
              [IO.File]::WriteAllText($f.FullName, $a.body, (New-Object System.Text.UTF8Encoding $false))
              gh issue create --repo "${{ github.repository }}" --title $a.title --body-file $f.FullName
            }
          }

      - name: Cerrar alertas resueltas
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          if (Test-Path data\alerts-close.json) {
            $items = (Get-Content data\alerts-close.json -Raw -Encoding UTF8 | ConvertFrom-Json) | ForEach-Object { $_ }
            if ($items) {
              $open = (gh issue list --repo "${{ github.repository }}" --state open --limit 200 --json number,title | Out-String | ConvertFrom-Json) | ForEach-Object { $_ }
              foreach ($x in $items) {
                $iss = $open | Where-Object { $_.title -eq $x.title } | Select-Object -First 1
                if (-not $iss) { Write-Host "Sin issue abierto para: $($x.title)"; continue }
                $f = New-TemporaryFile
                [IO.File]::WriteAllText($f.FullName, $x.body, (New-Object System.Text.UTF8Encoding $false))
                gh issue comment $iss.number --repo "${{ github.repository }}" --body-file $f.FullName
                gh issue close $iss.number --repo "${{ github.repository }}" --reason completed
              }
            }
          }

      - name: Ejecutar copiador NFL
        if: always()
        shell: powershell
        run: .\copier.ps1

      - name: Guardar datos en el repositorio
        if: always()
        shell: bash
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
